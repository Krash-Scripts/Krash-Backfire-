name: Bug report
description: Report a reproducible problem with KR4SH Backfire.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [installation guide](https://github.com/Krash-Scripts/Krash-Backfire-/blob/main/docs/INSTALLATION.md) and [troubleshooting](https://github.com/Krash-Scripts/Krash-Backfire-/blob/main/docs/TROUBLESHOOTING.md) first. Remove passwords, tokens and license keys from your logs.
  - type: input
    id: version
    attributes:
      label: Resource version
      description: Which resource ZIP/build are you using?
      placeholder: e.g. 1.8.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give exact actions from a clean starting state.
      placeholder: "1. Enter a vehicle ...\n2. Use tablet ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Server environment
      description: FiveM artifact, ESX, ox_lib/ox_inventory/oxmysql versions, vehicle model and companion resources.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Redact server license keys, database credentials, private identifiers and tokens.
      render: text
    validations:
      required: false
